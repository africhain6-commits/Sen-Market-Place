[build]
  command = "corepack enable && corepack prepare pnpm@9 --activate && pnpm install --frozen-lockfile && PORT=3000 BASE_PATH=/ pnpm --filter @workspace/sen-market run build"
  publish = "artifacts/sen-market/dist/public"

[build.environment]
  NODE_VERSION = "20"

# SPA routing: any non-file route falls back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Uncomment and set this once your backend (api-server) is hosted somewhere
# (Render, Railway, Fly.io...). This proxies /api/* calls made by the frontend
# to your real backend, since Netlify can't run the Express server itself.
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND-URL.example.com/api/:splat"
#   status = 200
#   force = true
